  const remaining = CONFIG.auctionDurationMs - used;
  const spread = CONFIG.auctionBuyoutPrice - CONFIG.auctionStartPrice;
  return {used, remaining, price: CONFIG.auctionStartPrice + Math.floor(used / CONFIG.auctionDurationMs * spread)};
}

function clock(ms) {
  const seconds = Math.max(0, Math.ceil(ms / 1000));
  return [Math.floor(seconds / 60), seconds % 60].map(n => String(n).padStart(2,'0')).join(':');
}

function refreshAuction() {
  const {remaining,price} = auctionState();
  for (const node of document.querySelectorAll('[data-auction-clock]')) node.textContent = clock(remaining);
  for (const node of document.querySelectorAll('[data-auction-price]')) node.textContent = yen.format(price);
  const callClock = $('[data-call-clock]', dialog);
  if (callClock) {
    const elapsed = (state.callEndedAt || Date.now()) - state.callStartedAt;
    callClock.textContent = clock(Math.floor(elapsed / 1000) * 1000);
  }
  if (state.phase === 'playing' && remaining <= 0) finishLoss('time');
}

function withinTime() {
  refreshAuction();
  return state.phase === 'playing';
}

function routePath(site, page, art = null) {
  return '#/' + site + '/' + page + (art ? '/' + art : '');
}

function parseRoute(path) {
  const [site,page,id] = (path || '').replace(/^#\//,'').split('/');
  if (site === 'ending' && state.phase === 'clear') return {site,page:'apple',art:null};
  const allowed = site === 'gallery' && ['home','privacy'].includes(page)
    || Object.hasOwn(navItems, site) && navItems[site].some(item => item[0] === page);
  if (!allowed) return {site:'gallery',page:'home',art:null};
  return {site,page,art:site === 'gallery' && artById(id) ? id : null};
}

function link(site, page, label, className = '', art = null) {
  const path = routePath(site,page,art);
  return `<a href="${path}" data-route="${path}"${className ? ' class="'+className+'"' : ''}>${label}</a>`;
}

function artLink(id, label, className = '') {
  const page = state.route.site === 'gallery' ? state.route.page : 'works';
  return link('gallery',page,label,className,id);
}

function changeRoute(path, replace = false) {
  if (!withinTime()) return;
  const target = parseRoute(path);
  const samePage = target.site === state.route.site && target.page === state.route.page;
  const currentPath = routePath(state.route.site,state.route.page,state.route.art);
  if (path === currentPath) return;
  const entry = {path, y: samePage ? window.scrollY : 0, artBack: Boolean(target.art && samePage)};
  if (replace) {
    entry.artBack = history.state?.artBack ?? false;
    history.replaceState(entry,'',path);
  } else {
    history.replaceState({...history.state,path:currentPath,y:window.scrollY},'');
    history.pushState(entry,'',path);
  }
  applyRoute(target, samePage ? window.scrollY : 0);
}

function applyRoute(target, y = 0) {
  const samePage = target.site === state.route.site && target.page === state.route.page;
  state.route = target;
  if (!samePage) {
    closeDialog(false);
    renderPage();
  }
  if (state.phase !== 'playing') return;
  if (target.art) openArtwork(target.art);
  else if (state.modal === 'art') closeDialog();
  if (!samePage || !target.art) window.scrollTo(0,y);
}

function onHistory() {
  if (state.phase === 'resolved') {
    openNews();
    return;
  }
  if (state.phase === 'clear') {
    closeDialog(false);
    if (location.hash !== routePath('ending','apple')) {
      openNews();
    } else {
      renderPage();
      window.scrollTo(0,0);
    }
    return;
  }
  if (state.phase !== 'playing') return;
  if (state.modal === 'report') {
    const path = routePath(state.route.site,state.route.page,state.route.art);
    if (location.hash !== path) history.pushState({path,y:window.scrollY},'',path);
    return;
  }
  applyRoute(parseRoute(location.hash),history.state?.y ?? 0);
}

  app.innerHTML = header(site) + pageView + footer(site)
    + `<button type="button" class="chat-launch" data-action="chat" aria-haspopup="dialog">${chatIcon}チャット</button>`
    + (CONFIG.debug ? debugPanel() : '');

}

function showDialog(kind, className, markup, {preserveScroll = false} = {}) {
  const priorKind = state.modal;
  const scroll = dialog.scrollTop;
  if (!dialog.open) returnFocus = document.activeElement;
  if (priorKind === 'art' && kind !== 'art') clearTimeout(amberTimer);
  state.modal = kind;
  dialog.className = className;
  dialog.innerHTML = markup;
  if (!dialog.open) dialog.showModal();
  dialog.scrollTop = preserveScroll && priorKind === kind ? scroll : 0;
  refreshAuction();
}

function closeDialog(restoreFocus = true) {
  clearTimeout(amberTimer);
  const anchor = returnFocus;
  state.modal = null;
  returnFocus = null;
  if (dialog.open) dialog.close();
  dialog.className = '';
  if (restoreFocus && anchor?.isConnected) anchor.focus({preventScroll:true});
}

function modalHead(title, label = '', close = true) {
  return `<div class="modal-head"><div id="dialog-title" class="terminal-head">
    ${label ? `<span class="eyebrow">${e(label)}</span>` : ''}<strong>${e(title)}</strong></div>
    ${close ? '<button type="button" class="close" data-action="close" aria-label="閉じる">×</button>' : ''}</div>`;
}

function woodAxisY(puzzle,x) {
  const [pithX,pithY] = puzzle.pith;
  return pithY + (x-pithX) * puzzle.axis.slope;
}

function woodAxisLetters(puzzle) {
  const {fromX,toX} = puzzle.axis;
  return puzzle.letters.filter(([,x,y])=>x>=fromX && x<=toX && Math.abs(y-woodAxisY(puzzle,x))<=3)
    .sort((a,b)=>a[1]-b[1]).map(([char])=>char);
}

function ringsDiagram(puzzle) {
  const {pith,rings,letters,axis} = puzzle;
  const [pithX,pithY] = pith;
  const knots = [axis.fromX,axis.toX].map(x=>{
    const y = woodAxisY(puzzle,x).toFixed(1);
    return `<g class="grain-knot" transform="translate(${x} ${y}) rotate(-20)">
      <ellipse rx="6" ry="3.2" fill="none" stroke="#765137"/>
      <ellipse rx="2.6" ry="1.2" fill="#765137"/>
    </g>`;
  }).join('');
  const reverseLetters = woodAxisLetters(puzzle).reverse().join('、');
  return `<svg class="rings" viewBox="0 0 560 270" role="img" aria-labelledby="rings-title rings-description">
    <title id="rings-title">木口の拡大写真に描いた年輪</title>
    <desc id="rings-description">左半分の年輪は狭く、右半分は広い。両端に小さな節がある。節と芯の並びに重なる文字を右側から挙げると、${e(reverseLetters)}。</desc>
    <defs>
      <linearGradient id="wood-grain-base" x2="1" y2="1">
        <stop stop-color="#dbc197"/><stop offset=".56" stop-color="#e4cba4"/><stop offset="1" stop-color="#c19b70"/>
      </linearGradient>
      <pattern id="wood-grain-ticks" width="23" height="17" patternUnits="userSpaceOnUse" patternTransform="rotate(-16)">
        <path d="M-4 2H24M-4 10H19M7 15H24" stroke="#8b5632" stroke-width="1" stroke-opacity=".1"/>
      </pattern>
    </defs>
    <rect width="560" height="270" fill="url(#wood-grain-base)"/>
    <rect width="560" height="270" fill="url(#wood-grain-ticks)"/>
    ${rings.map(({left,right,ry},i)=>{
      const cx = (left+right)/2;
      const rx = (right-left)/2;
      return `<ellipse cx="${cx}" cy="${pithY}" rx="${rx}" ry="${ry}" fill="none" stroke="#6b462e" stroke-opacity="${i % 2 ? '.52' : '.63'}" stroke-width="${i % 3 ? 1.4 : 2}"/>`;
    }).join('')}
    ${knots}
    <circle cx="${pithX}" cy="${pithY}" r="4" fill="#765137" opacity=".66"/>
    ${letters.map(([letter,x,y,size,angle])=>`<text x="${x}" y="${y}" dy=".34em" font-size="${size}"
      text-anchor="middle" transform="rotate(${angle} ${x} ${y})">${e(letter)}</text>`).join('')}
  </svg>`;
}

function furWall(puzzle) {
  return visual('studio-wall','画家のアトリエの壁',{
    className:'photo studio-wall',
    extra:`<span class="wall-writing">${e(puzzle.inscription)}</span>`
  });
}

function detail(label, content) {
  return `<details class="art-detail"><summary>${e(label)}</summary>${content}</details>`;
}

function artworkDetail(art) {
  const puzzle = art.puzzle;
  switch (puzzle?.kind) {
    case 'glass':
      return `<div class="art-detail"><strong>光の記録</strong><ul class="glass-lines">${puzzle.words.map(row=>`<li><span class="sr">記録：</span>${row.map(word=>`<span>${e(word)}</span>`).join('')}</li>`).join('')}</ul></div>`;
    case 'wood':
      return detail('木口の拡大を見る',ringsDiagram(puzzle));
    case 'fur':
      return detail('アトリエの壁の写真を見る',furWall(puzzle));
    case 'shell':
      return detail('貝殻の配列を見る',`<p>■ 長い殻　・ 短い殻</p>
        ${puzzle.groups.map(group=>`<div class="shell-rows">${group.map(code=>`<span aria-label="${e([...code].map(mark=>mark==='-'?'長':'短').join('、'))}">${morseMarks(code)}</span>`).join('')}</div>`).join('')}`);
    default: {
      const reference = art.reference;
      return reference ? detail(reference.label,`<figure class="studio-record ${e(reference.style)}">
        <figcaption>${e(reference.caption)}</figcaption>
        <pre>${e(reference.marks.join('\n'))}</pre>
        <p>${e(reference.note)}</p>
      </figure>`) : '';
    }
  }
}

function artOverlay(art) {

    const rows = art.puzzle.markers.map(row=>row.join(' · '));

  }

    return '<span class="amber-phrase" data-amber aria-live="polite" hidden></span>';
  }

}

      const phrase = $('[data-amber]',dialog);

      phrase.hidden = false;

    },CONFIG.amberDelayMs);

function normalize(value) {
  return value.normalize('NFKC').toLowerCase()
    .replace(/[ァ-ヶ]/g,char=>String.fromCharCode(char.charCodeAt(0)-0x60))
    .replace(/[\s、。,.・／/:：!！?？]+/g,'');
}

function matches(value, accepted) {
  return accepted.some(answer => normalize(value) === normalize(answer));
}

function normalizePhrase(value) {
  return value.normalize('NFKC').trim().replace(/\s+/g,' ').toUpperCase();
}

function derivePuzzleAnswer(art) {
  const puzzle = art.puzzle;
  switch (puzzle.kind) {
    case 'glass': return puzzle.markers.flatMap((row,i)=>row.map((marker,j)=>[...puzzle.words[i][j]][marker-1] ?? '？')).join('');
    case 'wood': return woodAxisLetters(puzzle).join('');
    case 'fur': return [...puzzle.inscription].filter(char=>!puzzle.noise.includes(char)).join('');
    case 'shell': {
      const decode = Object.fromEntries(Object.entries(MORSE).map(([key,value])=>[value,key]));
      return puzzle.groups.map(group=>group.map(code=>decode[code] ?? '？').join('')).join(' ');
    }
    case 'amber': return CONFIG.secretChatPhrase;
    default: return '';
  }
}

const publicQuestions = [
  ['作品を購入できますか', '販売状況は各作品の詳細をご覧ください。新作はオンライン競売でご案内しております。'],
  ['作品を展示したい', '貸出のご相談は、希望する作品名と展示時期を窓口宛てにお知らせください。'],
  ['作家について知りたい', '作家の経歴は、Artistページに掲載しております。']
];
const SOS = [
  '窓のない部屋にいます。明け方に船の汽笛が聞こえるんです。外にいた人は三人。',
  '来る途中、赤い灯台が見えました。ここに届く荷物の番号を、広報の人が控えていたはずです。',
  '競売が終わったら別の場所に連れて行くと言われました。ぼくの代わりに通報してくれませんか。'
];

function addMessage(log, kind, text) {
  log.push({kind,text});
}

function logMarkup(log, label) {
  return `<div class="chat-flow" role="log" aria-live="polite" aria-label="${e(label)}" tabindex="0">
    ${log.map(entry=>`<p class="bubble ${entry.kind}"><span class="sr">${entry.kind==='mine'?'送信：':entry.kind==='system'?'システム：':'受信：'}</span>${e(entry.text)}</p>`).join('')}
  </div>`;
}

function inputForm(form, placeholder) {
  return `<form data-form="${form}">
    <label class="sr" for="terminal-input">${e(placeholder)}</label>
    <input id="terminal-input" type="text" name="answer" placeholder="${e(placeholder)}"
      inputmode="text" enterkeyhint="send" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus required maxlength="150">
    <button type="submit" data-send>送信</button></form>`;
}

function choiceButtons(choices, forVerification = false) {
  return `<p class="choice-label">回答を選ぶ</p>
    <div class="choices${forVerification ? ' verification-choices' : ''}" data-choice-list
      role="group" aria-label="回答の選択肢" tabindex="-1">
      ${choices.map((choice,i)=>`<button type="button" data-choice="${i}">${e(choice.label ?? choice)}</button>`).join('')}
    </div>`;
}

function focusTerminal() {
  const log = $('.chat-flow',dialog);
  if (log) log.scrollTop = log.scrollHeight;
  const control = $('#terminal-input',dialog) ?? $('[data-choice-list]',dialog);
  control?.focus({preventScroll:true});
}

function openChat() {
  if (withinTime()) renderChat();
}

function renderChat() {
  const normal = state.chatStage === 'normal';
  const stage = state.chatStage;
  let entry;
  if (normal) {
    entry = inputForm('chat','メッセージを入力')+`<div class="suggestions">${publicQuestions.map(([question],i)=>`<button type="button" data-suggestion="${i}">${e(question)}</button>`).join('')}</div>`;
  } else if (stage === 'verification') {
    entry = choiceButtons(verificationQuestions[state.chatStep].choices,true);
  } else if (stage === 'sos') {
    entry = state.sosLinesShown === SOS.length ? '<button type="button" data-action="report">警察に通報する</button>' : '<p class="choice-label">受信中…</p>';
  } else {
    entry = '<p class="choice-label">通信切断</p>'+(CONFIG.failOnChatWrongAnswer ? '<button type="button" data-action="restart">最初から遊ぶ</button>' : '<button type="button" data-action="retry-chat">窓口に再接続する</button>');
  }
  showDialog('chat','terminal'+(normal?' public':''),`${modalHead(normal?'ギャラリー窓口':'通信端末',normal?'Gallery Desk':'Private Connection')}
    ${logMarkup(state.chatLog,'チャット履歴')}
    <div class="entry">${entry}${CONFIG.debug ? debugInner('chat') : ''}</div>`);
  focusTerminal();
}

function beginVerification() {
  state.chatStage = 'verification';
  state.chatStep = 0;
  addMessage(state.chatLog,'system','自動応答を終了しました。別の回線に接続しています。');
  addMessage(state.chatLog,'guest','水田ミチルです。絵を読んだ人ですか。通信は不安定です。確実な情報だけを送ってください。');
  addMessage(state.chatLog,'guest',verificationQuestions[0].prompt);
}

function beginSOS() {
  state.chatStage = 'sos';
  state.sosLinesShown = 1;
  addMessage(state.chatLog,'guest',SOS[0]);
  const sequence = ++state.seq;
  SOS.slice(1).forEach((line,i)=>setTimeout(()=>{
    if (sequence !== state.seq || !withinTime()) return;
    state.sosLinesShown++;
    addMessage(state.chatLog,'guest',line);
    if (state.modal === 'chat') renderChat();
  },650*(i+1)));
}

function sendChat(value) {
  if (!withinTime() || !value.trim() || state.chatStage !== 'normal') return;
  addMessage(state.chatLog,'mine',value);
  if (normalizePhrase(value) === normalizePhrase(CONFIG.secretChatPhrase)) {
    beginVerification();
  } else {
    const faq = publicQuestions.find(([question])=>matches(value,[question]));
    const keyword = /購[入買]|価格|競売|値段/.test(value) ? 0 : /作家|経歴|プロフィール/.test(value) ? 2 : /展示|貸出/.test(value) ? 1 : -1;
    addMessage(state.chatLog,'guest',faq?.[1] ?? publicQuestions[keyword]?.[1] ?? 'お問い合わせありがとうございます。作品の購入、展示、作家についてのご質問を選択できます。');
  }
  renderChat();
}

function answerVerification(index) {
  if (!withinTime() || state.modal !== 'chat' || state.chatStage !== 'verification') return;
  const question = verificationQuestions[state.chatStep];
  const choice = question.choices[index];
  if (!choice) return;
  addMessage(state.chatLog,'mine',choice);
  if (choice !== question.answer) {
    state.chatStage = 'disconnected';
    addMessage(state.chatLog,'system','音声が途切れました。この回線への接続は終了しました。');
  } else {
    addMessage(state.chatLog,'guest',question.reply);
    state.chatStep++;
    if (state.chatStep === verificationQuestions.length) beginSOS();
    else addMessage(state.chatLog,'guest',verificationQuestions[state.chatStep].prompt);
  }
  renderChat();
}

function retryChat() {
  if (CONFIG.failOnChatWrongAnswer || !withinTime()) return;
  state.chatStage = 'normal';
  state.chatLog = [{kind:'guest',text:'ギャラリーの窓口に再接続しました。'}];
  renderChat();
}

function startCall() {
  if (!withinTime() || state.chatStage !== 'sos' || state.sosLinesShown < SOS.length) return;
  state.callStep = 0;
  state.callStartedAt = Date.now();
  state.callEndedAt = 0;
  state.callLog = [
    {kind:'system',text:'架空の指令室に接続しました。回答は慎重に。誤りがあると通信が切断されます。'},
    {kind:'guest',text:policeQuestions[0].prompt}
  ];
  renderCall('calling');
}

function renderCall(status) {
  const question = policeQuestions[state.callStep];
  let entry = '<p class="choice-label">通話終了</p>';
  if (status === 'calling' && question.choices) {
    entry = choiceButtons(question.choices);
  } else if (status === 'calling') {
    entry = inputForm('report',question.placeholder);
  }
  const callStatus = {calling:'指令室 — 通話中', disconnected:'指令室 — 通信切断', dispatch:'指令室 — 通話終了'}[status];
  showDialog('report','terminal',`<div class="modal-head">
    <div id="dialog-title" class="terminal-head"><span class="eyebrow">ゲーム内の架空通報</span><strong>${callStatus}</strong></div>
    <div class="phone-indicator"><span class="sr">通話時間</span><span class="mono call-time" data-call-clock>00:00</span></div></div>
    ${logMarkup(state.callLog,'通報履歴')}
    <div class="entry">${entry}${status==='calling'&&CONFIG.debug ? debugInner('report') : ''}</div>`);
  focusTerminal();
}

function submitCall(value, display = value) {
  if (!withinTime() || !value.trim() || state.modal !== 'report' || state.callEndedAt) return;
  const question = policeQuestions[state.callStep];
  addMessage(state.callLog,'mine',display);
  if (!matches(value,question.accepted)) {
    if (!CONFIG.failOnPoliceWrongAnswer) {
      addMessage(state.callLog,'guest','照合できませんでした。もう一度、確認できる情報をお願いします。');
      renderCall('calling');
      return;
    }
    state.callEndedAt = Date.now();
    addMessage(state.callLog,'system','信号が途切れました。通信切断。');
    renderCall('disconnected');
    const sequence = ++state.seq;
    setTimeout(()=>{
      if (sequence === state.seq && state.phase === 'playing') finishLoss('report');
    },820);
    return;
  }
  state.callStep++;
  if (state.callStep === policeQuestions.length) {
    if (!withinTime()) return;
    state.auctionStoppedAt = auctionState().used;
    state.phase = 'resolved';
    state.callEndedAt = Date.now();
    addMessage(state.callLog,'guest','情報を受理しました。捜索班を西港支店へ向かわせます。ご協力ありがとうございました。');
    renderCall('dispatch');
    setTimeout(()=>{
      if (state.phase === 'resolved') openNews();
    },850);
  } else {
    addMessage(state.callLog,'guest',policeQuestions[state.callStep].prompt);
    renderCall('calling');
  }
}

function articleDate(article) {
  return `<time datetime="${e(article.date)}">${e(article.date.replaceAll('-','.'))}</time> <span class="eyebrow muted">${e(article.label)}</span>`;
}

function openNews() {
  const [lead,...updates] = newsArticles;
  showDialog('news','news',`
    <header>
      <div class="news-bar"><div class="news-wrap">社会 / 特集</div></div>

    </header>
    <main class="news-wrap news-content">
      <article class="news-lead">

        ${visual(lead.image,lead.alt,{className:'photo'})}
      </article>
      <ol class="news-updates">${updates.map(article=>`<li><article class="news-article">
        ${articleDate(article)}<h2>${e(article.title)}</h2><p>${e(article.body)}</p>
        ${article.final ? '<a class="action" href="#/ending/apple" data-action="ending">水田ミチルの新しい公式ギャラリーを見る →</a>' : ''}
      </article></li>`).join('')}</ol>
    </main>`);

function finishGame() {
  if (!['resolved','clear'].includes(state.phase) || state.modal !== 'news') return;
  state.phase = 'clear';
  closeDialog(false);
  state.route = {site:'ending',page:'apple',art:null};
  const path = routePath('ending','apple');
  if (location.hash !== path) history.pushState({path,y:0},'',path);
  renderPage();
  window.scrollTo(0,0);
  const heading = $('#content h1');
  heading.tabIndex = -1;
  heading.focus({preventScroll:true});
}

function finishLoss(reason) {
  if (state.phase !== 'playing') return;
  state.auctionStoppedAt = auctionState().used;
  state.phase = 'loss';
  state.lossReason = reason;
  state.seq++;
  const time = reason === 'time';
  showDialog('loss','loss',`
    <p class="eyebrow muted">${time ? 'Auction closed' : 'Connection lost'}</p>
    <h2 id="dialog-title">${time ? '落札されました' : '通報が途切れました'}</h2>
    <p>${time ? `Glass Apple の競売が ${yen.format(CONFIG.auctionBuyoutPrice)} で終了しました。引き渡しの手続きが始まっています。` : '指令室に必要な情報が届きませんでした。回線は切断され、捜索を開始できません。'}</p>
    <p class="eyebrow muted">Game Over</p>
    <button type="button" class="action" data-action="restart">最初から遊ぶ</button>`);
}

function closeActiveModal() {
  if (['report','news','loss'].includes(state.modal)) return;
  if (state.modal === 'art') {
    if (history.state?.artBack) {
      history.back();
    } else {
      const {site,page} = state.route;
      const path = routePath(site,page);
      history.replaceState({path,y:window.scrollY,artBack:false},'',path);
      applyRoute({site,page,art:null},window.scrollY);
    }
  } else {
    closeDialog();
  }
}

    <button type="button" data-debug="fast">競売を60倍速</button>
    <button type="button" data-debug="last">残り5秒にする</button>
    <button type="button" data-debug="over">時間切れ</button>
    <button type="button" data-debug="chat">本人確認へ</button>
    <button type="button" data-debug="report">通報へ</button>
    <button type="button" data-debug="audit">仮暗号を検算</button>
    <button type="button" data-action="restart">リセット</button>

function debugInner(kind) {
  return `<div class="debug-inner">
    ${kind === 'chat' && state.chatStage !== 'verification' ? '' : '<button type="button" data-debug="pass">この設問を正解</button>'}
    <button type="button" data-debug="over">時間切れ</button>
    <button type="button" data-action="restart">リセット</button>

}

function setElapsed(ms,speed = state.speed) {
  const now = Date.now();
  state.speed = speed;
  state.startedAt = now - ms / speed;
  refreshAuction();
}

function debugAction(action) {
  if (!CONFIG.debug || state.phase !== 'playing') return;
  switch (action) {
    case 'fast': setElapsed(auctionState().used,60); break;
    case 'last': setElapsed(CONFIG.auctionDurationMs-5000,1); break;
    case 'over': setElapsed(CONFIG.auctionDurationMs,1); break;
    case 'chat':
      beginVerification();
      renderChat();
      break;
    case 'report':
      state.chatStage = 'sos';
      state.sosLinesShown = SOS.length;
      startCall();
      break;
    case 'pass':
      if (state.modal === 'report') submitCall(policeQuestions[state.callStep].accepted[0]);
      else if (state.modal === 'chat' && state.chatStage === 'verification') {
        const question = verificationQuestions[state.chatStep];
        answerVerification(question.choices.indexOf(question.answer));
      }
      break;
    case 'audit': {
      const audit = artworks.filter(art=>art.puzzle).map(art=>{
        const answer = derivePuzzleAnswer(art);
        return (answer === art.answer ? '✓ ' : '× ') + art.title + ' → ' + answer;
      });
      const waybill = company.shipments.find(item => item.ref === 'WM-417');
      audit.push('✓ 納品控え WM-417 → ' + waybill.code + ' ' + company.branches.find(branch=>branch.code === waybill.code).name);
      state.debugOutput = audit.join('\n');
      const output = $('[data-debug-output]');
      if (output) output.textContent = state.debugOutput;
      break;
    }
  }
}

document.addEventListener('error',event=>{
  if (!event.target.matches?.('.art-image')) return;
  event.target.hidden = true;
  const alternative = $('[data-image-fallback]',event.target.parentElement);
  if (alternative) alternative.hidden = false;
},true);

document.addEventListener('click',event=>{
  const target = event.target.closest('[data-route],[data-action],[data-adjacent],[data-choice],[data-suggestion],[data-debug]');
  if (!target) return;
  if (target.matches('a') && (event.ctrlKey || event.shiftKey || event.metaKey || event.altKey)) return;
  event.preventDefault();
  if (target.dataset.route) {
    changeRoute(target.dataset.route);
  } else if (target.dataset.adjacent) {
    changeRoute(routePath('gallery',state.route.page,target.dataset.adjacent),true);
  } else if (target.dataset.choice !== undefined) {
    const index = Number(target.dataset.choice);
    if (state.modal === 'chat') answerVerification(index);
    else if (state.modal === 'report') {
      const choice = policeQuestions[state.callStep]?.choices?.[index];
      if (choice) submitCall(choice.value ?? choice, choice.label ?? choice);
    }
  } else if (target.dataset.suggestion !== undefined) {
    sendChat(publicQuestions[Number(target.dataset.suggestion)][0]);
  } else if (target.dataset.debug) {
    debugAction(target.dataset.debug);
  } else {
    switch (target.dataset.action) {
      case 'chat': openChat(); break;
      case 'close': closeActiveModal(); break;
      case 'retry-chat': retryChat(); break;
      case 'report': startCall(); break;
      case 'ending': finishGame(); break;
      case 'restart': location.reload(); break;
      case 'collection':
        $('#collection').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
        break;
    }
  }
});

function submitTerminal(form) {
  const field = form.elements.namedItem('answer');
  const answer = field.value;
  if (!answer.trim()) {
    field.focus();
    return;
  }
  if (form.dataset.form === 'chat') sendChat(answer);
  else if (form.dataset.form === 'report') submitCall(answer);
}

dialog.addEventListener('click',event=>{
  const button = event.target.closest('[data-send]');
  if (!button) return;
  event.preventDefault();
  submitTerminal(button.form);
});

dialog.addEventListener('keydown',event=>{
  if (event.key !== 'Enter' || event.isComposing || event.keyCode === 229 || !event.target.matches('#terminal-input')) return;
  event.preventDefault();
  if (!event.repeat) submitTerminal(event.target.form);
});

dialog.addEventListener('submit',event=>{
  if (!event.target.matches('form[data-form]')) return;
  event.preventDefault();
  submitTerminal(event.target);
});

dialog.addEventListener('cancel',event=>{
  event.preventDefault();
  closeActiveModal();
});
window.addEventListener('popstate',onHistory);
document.addEventListener('visibilitychange',refreshAuction);
history.scrollRestoration = 'manual';
history.replaceState({path:routePath('gallery','home'),y:0,artBack:false},'',
  location.pathname+location.search+routePath('gallery','home'));
window.scrollTo(0,0);
renderPage();
setInterval(refreshAuction,250);

</script>
</body>
</html>
